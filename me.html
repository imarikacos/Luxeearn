<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxeEarn - Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a0033 0%, #330066 100%);
            min-height: 100vh;
            color: #fff;
        }

        .header {
            position: sticky;
            top: 0;
            background: rgba(26, 0, 51, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.1);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: none;
            color: #00ffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .back-btn:hover {
            opacity: 0.7;
        }

        .back-btn svg {
            width: 20px;
            height: 20px;
            fill: #00ffff;
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .profile-header {
            background: transparent;
            padding: 20px 0;
            margin-bottom: 25px;
        }

        .profile-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .profile-info {
            flex: 1;
        }

        .greeting {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .user-email {
            font-size: 16px;
            color: #fff;
            margin-bottom: 8px;
            word-break: break-all;
        }

        .username {
            font-size: 14px;
            color: #00ffff;
            margin-bottom: 12px;
            min-height: 20px;
        }

        .profile-gif {
            width: 120px;
            height: 120px;
            border-radius: 15px;
            object-fit: cover;
            margin-left: 15px;
            flex-shrink: 0;
        }

        .vip-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a0033;
            padding: 6px 16px;
            border-radius: 15px;
            font-weight: 700;
            font-size: 12px;
        }

        .balance-card {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.1), rgba(0, 255, 255, 0.1));
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        .balance-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .balance-item {
            text-align: center;
        }

        .balance-label {
            font-size: 14px;
            color: #00ffff;
            margin-bottom: 10px;
        }

        .balance-amount {
            font-size: 32px;
            font-weight: 800;
            color: #ccff00;
        }

        .menu-list {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .menu-item {
            padding: 18px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.3s ease;
            text-decoration: none;
            color: #fff;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .menu-item:hover {
            background: rgba(0, 255, 255, 0.05);
        }

        .menu-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu-icon {
            width: 24px;
            height: 24px;
            fill: #00ffff;
        }

        .menu-label {
            font-size: 15px;
        }

        .menu-arrow {
            width: 18px;
            height: 18px;
            fill: #888;
        }

        .menu-item.logout {
            color: #fff;
        }

        .menu-item.logout .menu-icon {
            fill: #00ffff;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html" class="back-btn">
            <svg viewBox="0 0 24 24">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
            Home
        </a>
    </div>

    <div class="container">
        <div class="profile-header">
            <div class="profile-top">
                <div class="profile-info">
                    <div class="greeting">Hi,</div>
                    <div class="user-email" id="displayEmail">user@example.com</div>
                    <div class="username" id="displayUsername"></div>
                    <div class="vip-badge">vip0</div>
                </div>
                <img src="my-58d9e81d.gif" alt="Profile" class="profile-gif">
            </div>
        </div>

        <div class="balance-card">
            <div class="balance-grid">
                <div class="balance-item">
                    <div class="balance-label">Total balance (USDT)</div>
                    <div class="balance-amount" id="totalBalance">0</div>
                </div>
                <div class="balance-item">
                    <div class="balance-label">Recharge amount (USDT)</div>
                    <div class="balance-amount" id="rechargeBalance">0.00</div>
                </div>
            </div>
        </div>

        <div class="menu-list">
            <a href="account.html" class="menu-item">
                <div class="menu-left">
                    <svg class="menu-icon" viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    <span class="menu-label">Account</span>
                </div>
                <svg class="menu-arrow" viewBox="0 0 24 24">
                    <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
                </svg>
            </a>

            <a href="recharge.html" class="menu-item">
                <div class="menu-left">
                    <svg class="menu-icon" viewBox="0 0 24 24">
                        <path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/>
                    </svg>
                    <span class="menu-label">Recharge</span>
                </div>
                <svg class="menu-arrow" viewBox="0 0 24 24">
                    <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
                </svg>
            </a>

            <a href="withdraw.html" class="menu-item">
                <div class="menu-left">
                    <svg class="menu-icon" viewBox="0 0 24 24">
                        <path d="M19 14V6c0-1.1-.9-2-2-2H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zm-9-1c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm13-6v11c0 1.1-.9 2-2 2H4v-2h17V7h2z"/>
                    </svg>
                    <span class="menu-label">Withdraw</span>
                </div>
                <svg class="menu-arrow" viewBox="0 0 24 24">
                    <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
                </svg>
            </a>

            <a href="records.html" class="menu-item">
                <div class="menu-left">
                    <svg class="menu-icon" viewBox="0 0 24 24">
                        <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                    </svg>
                    <span class="menu-label">Financial records</span>
                </div>
                <svg class="menu-arrow" viewBox="0 0 24 24">
                    <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
                </svg>
            </a>

            <a href="password.html" class="menu-item">
                <div class="menu-left">
                    <svg class="menu-icon" viewBox="0 0 24 24">
                        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                    </svg>
                    <span class="menu-label">Change Password</span>
                </div>
                <svg class="menu-arrow" viewBox="0 0 24 24">
                    <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
                </svg>
            </a>

            <a href="#" class="menu-item logout" onclick="logout(); return false;">
                <div class="menu-left">
                    <svg class="menu-icon" viewBox="0 0 24 24">
                        <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
                    </svg>
                    <span class="menu-label">Sign out</span>
                </div>
            </a>
        </div>
    </div>

    <script>
        function getTotalBalance() {
            const userBalance = parseFloat(localStorage.getItem('userBalance') || '0');
            const taskRewards = parseFloat(localStorage.getItem('LUXE_WALLET_BALANCE') || '0');
            return userBalance + taskRewards;
        }

        function updateBalance() {
            const totalBalance = getTotalBalance();
            const rechargeAmount = localStorage.getItem('rechargeAmount') || '0';
            const userEmail = localStorage.getItem('userEmail') || 'user@example.com';
            const username = localStorage.getItem('username') || '';
            
            document.getElementById('totalBalance').textContent = totalBalance.toFixed(2);
            document.getElementById('rechargeBalance').textContent = parseFloat(rechargeAmount).toFixed(2);
            document.getElementById('displayEmail').textContent = userEmail;
            document.getElementById('displayUsername').textContent = username;
        }

        function logout() {
            if (confirm('Are you sure you want to sign out?')) {
                localStorage.removeItem('luxeEarnUser');
                localStorage.removeItem('rememberMe');
                window.location.href = 'login.html';
            }
        }

        window.onload = function() {
            const user = JSON.parse(localStorage.getItem('luxeEarnUser') || '{}');
            
            if (user.email) {
                document.getElementById('displayEmail').textContent = user.email;
                localStorage.setItem('userEmail', user.email);
            }

            const username = localStorage.getItem('username') || '';
            document.getElementById('displayUsername').textContent = username;
            
            if (!localStorage.getItem('userBalance')) {
                localStorage.setItem('userBalance', '0');
            }
            if (!localStorage.getItem('rechargeAmount')) {
                localStorage.setItem('rechargeAmount', '0');
            }
            
            updateBalance();
        };

        window.addEventListener('storage', function(e) {
            if (e.key === 'userBalance' || e.key === 'rechargeAmount' || e.key === 'username' || e.key === 'LUXE_WALLET_BALANCE') {
                updateBalance();
            }
        });

        setInterval(updateBalance, 1000);
    </script>
</body>
</html>
